name: Benchmark Run

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model to benchmark (e.g. gpt-5.5, claude-sonnet-5-5, gemini-4-argon)"
        required: true
        default: "gpt-5.5"
      dataset:
        description: "Dataset to evaluate (e.g. all, licensing_national)"
        required: true
        default: "all"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Detect provider from model name
        id: detect_provider
        env:
          MODEL_NAME: ${{ github.event.inputs.model_name || 'gpt-5.5' }}
        run: |
          if echo "$MODEL_NAME" | grep -qE '/'; then
            echo "provider=openrouter" >> $GITHUB_OUTPUT
          elif echo "$MODEL_NAME" | grep -qiE '^(claude|anthropic)'; then
            echo "provider=anthropic" >> $GITHUB_OUTPUT
          elif echo "$MODEL_NAME" | grep -qiE '^gemini'; then
            echo "provider=google" >> $GITHUB_OUTPUT
          else
            echo "provider=openai" >> $GITHUB_OUTPUT
          fi
      - name: Run inference
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_NAME: ${{ github.event.inputs.model_name || 'gpt-5.5' }}
          DATASET: ${{ github.event.inputs.dataset || 'all' }}
          PROVIDER: ${{ steps.detect_provider.outputs.provider }}
        run: |
          uv run python -m brokerbench.inference.run_api \
            --model_name "$MODEL_NAME" \
            --dataset "$DATASET" \
            --output_file predictions/latest.jsonl \
            --provider "$PROVIDER"
      - name: Run evaluation
        run: |
          uv run python -m brokerbench.harness.run_evaluation \
            --predictions_path predictions/latest.jsonl \
            --dataset_name "$DATASET" \
            --run_id "$RUN_ID"
        env:
          DATASET: ${{ github.event.inputs.dataset || 'all' }}
          RUN_ID: ${{ github.run_id }}
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: logs/run_evaluation/
