[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brokerbench"
version = "0.2.0"
description = "A benchmark for evaluating real estate AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Ribera AI", email = "eng@ribera.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.99",
    "anthropic>=0.60",
    "google-genai>=1.20",
    "rich>=13.9",
    "tqdm>=4.66",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.15",
    "types-tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/ribera-ai/brokerbench"
Repository = "https://github.com/ribera-ai/brokerbench"
Issues = "https://github.com/ribera-ai/brokerbench/issues"

[tool.hatch.build.targets.wheel]
packages = ["brokerbench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["google.genai.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
